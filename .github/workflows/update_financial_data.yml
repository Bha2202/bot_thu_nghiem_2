name: Auto Update Financial Data

on:
  # Chạy định kỳ vào 00:00 Chủ Nhật hàng tuần theo giờ Việt Nam (17:00 Thứ 7 giờ UTC)
  schedule:
    - cron: '0 17 * * 6'
  # Cho phép bấm chạy thủ công trên giao diện web GitHub
  workflow_dispatch:

jobs:
  update-data:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Thiết lập môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cài đặt các thư viện cần thiết
        run: |
          python -m pip install --upgrade pip
          pip install pandas vnstock requests vnfinancialdata

      - name: Chạy script cào dữ liệu BCTC chính
        run: |
          python data/fetcher_financial.py

      - name: Bổ sung chỉ số Free Float chuẩn xác từ KBS
        run: |
          python data/patch_free_float.py

      - name: Tự động Commit và Push file JSON mới lên Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/financial_data.json data/fa_diagnostics.json
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore(data): auto-update financial and free float data [skip ci]" && git push)